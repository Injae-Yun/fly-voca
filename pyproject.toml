[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-voca"
version = "0.1.0"
description = "Internal-state (emotion) decoding on the FlyWire connectome: state axes, slow modulatory layers, and the persistence problem"
requires-python = ">=3.10"
dependencies = ["flyvoca", "numpy", "pandas", "scipy"]

[tool.setuptools.packages.find]
include = ["voca*"]
